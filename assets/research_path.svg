<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Scheduler Trace Lab 研究链路</title>
  <desc id="desc">工作负载经过 Scheduler、KV Cache、Model Runner 和 GPU 执行，并由 Trace、benchmark 与 profiler 证据支持策略判断。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="evidence" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e40c9"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a371f7"/>
    </marker>
    <style>
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .box-primary { fill: url(#primary); stroke: #58a6ff; stroke-width: 2; }
      .box-evidence { fill: url(#evidence); stroke: #a371f7; stroke-width: 2; }
      .label { fill: #f0f6fc; font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .sub { fill: #8b949e; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge-label { fill: #b1bac4; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #8b949e; stroke-width: 2.2; marker-end: url(#arrow); }
      .evidence-edge { fill: none; stroke: #a371f7; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow-accent); }
    </style>
  </defs>

  <rect x="1" y="1" width="1398" height="388" rx="18" fill="url(#background)" stroke="#30363d" stroke-width="2"/>

  <path class="edge" d="M 190 105 H 240"/>
  <path class="edge" d="M 420 105 H 485"/>
  <path class="edge" d="M 675 105 H 735"/>
  <path class="edge" d="M 925 105 H 985"/>
  <path class="edge" d="M 330 150 V 263 H 485"/>
  <path class="edge" d="M 1175 280 H 1230"/>

  <path class="evidence-edge" d="M 330 150 C 330 345, 815 350, 985 305"/>
  <path class="evidence-edge" d="M 675 280 H 985"/>
  <path class="evidence-edge" d="M 830 150 V 220 C 830 250, 920 272, 985 278"/>
  <path class="evidence-edge" d="M 1075 150 V 235"/>

  <g filter="url(#shadow)">
    <rect class="box" x="30" y="60" width="160" height="90" rx="12"/>
    <text class="label" x="110" y="96">精确 Token</text>
    <text class="sub" x="110" y="123">Workload</text>

    <rect class="box-primary" x="240" y="60" width="180" height="90" rx="12"/>
    <text class="label" x="330" y="96">vLLM Scheduler</text>
    <text class="sub" x="330" y="123" fill="#dbeafe">调度决策</text>

    <rect class="box" x="485" y="60" width="190" height="90" rx="12"/>
    <text class="label" x="580" y="96">SchedulerOutput</text>
    <text class="sub" x="580" y="123">逐请求 Token 计划</text>

    <rect class="box" x="735" y="60" width="190" height="90" rx="12"/>
    <text class="label" x="830" y="96">MRV2 输入准备</text>
    <text class="sub" x="830" y="123">Batch 与 Metadata</text>

    <rect class="box" x="985" y="60" width="190" height="90" rx="12"/>
    <text class="label" x="1080" y="96">TRITON_ATTN</text>
    <text class="sub" x="1080" y="123">GPU Kernels</text>

    <rect class="box" x="485" y="235" width="190" height="90" rx="12"/>
    <text class="label" x="580" y="271">KV Cache</text>
    <text class="sub" x="580" y="298">Blocks · 失败 · 抢占</text>

    <rect class="box-evidence" x="985" y="235" width="190" height="90" rx="12"/>
    <text class="label" x="1080" y="270">证据对齐</text>
    <text class="sub" x="1080" y="297" fill="#ede9fe">Trace · Benchmark · NCU</text>

    <rect class="box-primary" x="1230" y="235" width="140" height="90" rx="12"/>
    <text class="label" x="1300" y="270">策略判断</text>
    <text class="sub" x="1300" y="297" fill="#dbeafe">收益与边界</text>
  </g>

  <text class="edge-label" x="820" y="366">逐 step JSONL · persistent rows · tensor shapes · profiler counters</text>
</svg>

